<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>

  <!-- Satellite Orbit Ring -->
  <ellipse cx="32" cy="30" rx="24" ry="9" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" transform="rotate(-25 32 30)" filter="url(#glow)"/>
  
  <!-- Orbiting Satellite Dot -->
  <circle cx="51" cy="21" r="2.5" fill="#ffffff" filter="url(#glow)"/>

  <!-- Central Globe -->
  <circle cx="32" cy="31" r="14" fill="url(#globeGrad)" filter="url(#glow)"/>
  
  <!-- Latitude / Grid Lines -->
  <path d="M 18 31 A 14 6 0 0 0 46 31 A 14 6 0 0 0 18 31" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <path d="M 32 17 A 6 14 0 0 0 32 45 A 6 14 0 0 0 32 17" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

  <!-- Aquifer Subsurface Water Wave (Groundwater Layer) -->
  <path d="M 10 46 C 18 42, 26 50, 34 46 C 42 42, 50 50, 54 46 L 54 56 C 50 58, 42 54, 34 57 C 26 54, 18 58, 10 55 Z" fill="#00f2fe" opacity="0.85"/>
</svg>
